{% extends "base.html" %}
{% block content %}
    <h2>Отзыв об обучении</h2>
    <p class="text-muted">Заявка №{{ request_obj.id }} ({{ request_obj.get_transport_display }})</p>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-green">Отправить отзыв</button>
    </form>
    <a href="{% url 'profile' %}" class="btn" style="background-color: #6C757D;">Назад</a>
{% endblock %}
