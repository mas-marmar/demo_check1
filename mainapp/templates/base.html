{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Водить.РФ</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Rubik', sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 390px;
            margin: 0 auto;
            background: #FFFFFF;
            min-height: 100vh;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        
        .header {
            background-color: #007BFF;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px; 
        }
        
        .header img { 
            height: 40px; 
            width: auto;
        }
        
        .header h1 { 
            font-size: 24px;
            font-weight: 700; 
            color: #FFFFFF;
            margin: 0; 
        }

        h1 { font-size: 36px; font-weight: 700; color: #007BFF; margin: 0 0 15px 0; }
        h2 { font-size: 24px; font-weight: 500; color: #007BFF; margin: 0 0 15px 0; }
        h3 { font-size: 18px; font-weight: 500; margin: 0 0 10px 0; }
        p, a, label { font-size: 16px; font-weight: 400; }
        .text-muted { font-size: 12px; font-weight: 300; color: #6C757D; }
        
        .form-control {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #6C757D;
            border-radius: 4px;
            font-family: 'Rubik', sans-serif;
            font-size: 16px;
        }
        .btn {
            display: block;
            width: 100%;
            background-color: #007BFF;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-family: 'Rubik', sans-serif;
            transition: background 0.3s;
            text-align: center;
            text-decoration: none;
            margin-top: 10px;
        }
        .btn:hover { background-color: #0056b3; }
        .btn-green { background-color: #28A745; }
        .btn-green:hover { background-color: #218838; }
        
        .messages { list-style: none; padding: 0; margin-bottom: 20px; }
        .messages li { padding: 10px; border-radius: 4px; font-size: 14px; margin-bottom: 10px; }
        .messages .success { background-color: #d4edda; color: #155724; }
        .messages .error { background-color: #f8d7da; color: #721c24; }

        a { color: #4CCFE0; text-decoration: none; }
        a:hover { text-decoration: underline; }

        .request-card {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #007BFF;
        }
        .status-0 { color: #6C757D; font-weight: bold; }
        .status-1 { color: #4CCFE0; font-weight: bold; }
        .status-2 { color: #28A745; font-weight: bold; }

        .slider-container {
            position: relative;
            width: 100%;
            height: 200px;
            overflow: hidden;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .slider-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        .slider-slide.active {
            opacity: 1;
            z-index: 1;
        }
        .slider-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            z-index: 2;
            border-radius: 4px;
        }
        .slider-btn.prev { left: 10px; }
        .slider-btn.next { right: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="{% static 'images/logo.png' %}" alt="Логотип">
            <h1>Водить.РФ</h1>
        </div>

        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        
        {% block content %}{% endblock %}
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const slides = document.querySelectorAll('.slider-slide');
            if (slides.length === 0) return;

            let currentSlide = 0;
            let slideInterval;

            function showSlide(index) {
                slides.forEach(s => s.classList.remove('active'));
                slides[index].classList.add('active');
            }

            function nextSlide() {
                currentSlide = (currentSlide + 1) % slides.length;
                showSlide(currentSlide);
            }

            function prevSlide() {
                currentSlide = (currentSlide - 1 + slides.length) % slides.length;
                showSlide(currentSlide);
            }

            function startSlideShow() {
                slideInterval = setInterval(nextSlide, 3000);
            }

            function stopSlideShow() {
                clearInterval(slideInterval);
            }

            document.querySelector('.slider-btn.next').addEventListener('click', () => {
                nextSlide();
                stopSlideShow();
                startSlideShow();
            });
            document.querySelector('.slider-btn.prev').addEventListener('click', () => {
                prevSlide();
                stopSlideShow();
                startSlideShow();
            });

            showSlide(0);
            startSlideShow();
        });
    </script>
</body>
</html>
